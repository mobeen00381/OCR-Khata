<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0F172A" />
    <title>Offline · SteelKhata AI</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: "Segoe UI", system-ui, sans-serif;
        background: #f8fafc radial-gradient(circle at 80% 0%, rgba(30,64,175,.08), transparent 32%);
        color: #0f172a;
      }
      .card {
        width: 100%; max-width: 380px; border: 1px solid #e2e8f0; border-radius: 20px;
        background: #fff; padding: 28px; box-shadow: 0 18px 40px -28px rgba(15,23,42,.35);
      }
      .mark { width: 46px; height: 46px; border-radius: 13px; background: #0f172a; display: grid; place-items: center; }
      .eyebrow { margin: 22px 0 6px; font-size: 10px; font-weight: 700; letter-spacing: .16em; color: #64748b; text-transform: uppercase; }
      h1 { margin: 0; font-size: 24px; letter-spacing: -.04em; }
      p { font-size: 13px; line-height: 1.65; color: #64748b; }
      a { display: inline-flex; align-items: center; gap: 8px; margin-top: 12px; padding: 12px 16px; border-radius: 10px; background: #059669; color: #fff; font-size: 13px; font-weight: 700; text-decoration: none; }
      .hint { border-top: 1px solid #e2e8f0; margin-top: 22px; padding-top: 16px; font-size: 11px; color: #94a3b8; }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="mark" aria-hidden="true">
        <svg width="28" height="28" viewBox="0 0 40 40" fill="none">
          <circle cx="20" cy="20" r="12.5" stroke="#fff" stroke-width="2.2" />
          <circle cx="20" cy="20" r="6.8" stroke="#fff" stroke-opacity=".4" stroke-width="1.5" />
          <path d="M8 30 30 8" stroke="#34D399" stroke-width="2.4" stroke-linecap="round" />
        </svg>
      </div>
      <p class="eyebrow">SteelKhata AI</p>
      <h1>Aap abhi offline hain.</h1>
      <p>
        Parchi scan aur reports ke liye internet zaroori hai. Cached dashboard dekhne ke liye
        dobara try karein — connection wapas aate hi app khud refresh ho jayegi.
      </p>
      <a href="/dashboard">Try again</a>
      <p class="hint">Aapka saved demo data is device par mehfooz hai.</p>
    </main>
  </body>
</html>
